name: Deploy vagonto.com

# Laster opp siden til egen server (cPanel) over SFTP ved hver push til main.
# Hemmeligheter i repoet (Settings > Secrets and variables > Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (cPanel-kontoens brukernavn og passord)
# Filer på serveren som ikke kommer herfra (f.eks. .htaccess) blir liggende.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Last opp til serveren
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './*'
          remote_path: '/home/vagonto/public_html'
          sftp_only: true
          delete_remote_files: false
